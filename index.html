, aim 1000 m; rest 2 min x 3."]]},K='wtrlfc-tracker-v3';let S={r:{},s:{},m:{},player:'',position:''},week=1;try{S={...S,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){}const $=q=>document.querySelector(q),id=(...x)=>x.join('|');

function sched(){let w=(week-1)%4+1,x='<tr><th>Day</th>'+[1,2,3,4].map(i=>`<th class="weekcol ${w==i?'active':''}">Week ${i}</th>`).join('')+'</tr>';D.schedule.forEach(r=>x+='<tr>'+r.map((v,i)=>`<td class="${i&&w==i?'weekcol active':''}">${v}</td>`).join('')+'</tr>');$('#sched').innerHTML=x}

function met(){let x='<div class="metgrid">';D.met.forEach((m,i)=>x+=`<article class="card met ${S.m[i]?'complete':''}"><h3>${m[0]} · ${m[1]} · ${m[2]}</h3><div class="metfacts"><div class="fact"><b>Distance / Time</b>${m[3]}</div><div class="fact mode"><b>Mode</b>${m[4]}</div></div><p><b>Prescription:</b> ${m[5]}</p><label><input class="done" type="checkbox" data-m="${i}" ${S.m[i]?'checked':''}> Session complete</label></article>`);$('#metview').innerHTML=x+'</div>';document.querySelectorAll('[data-m]').forEach(e=>e.onchange=()=>{S.m[e.dataset.m]=e.checked;save();met()})}
function stats(){let total=(D.p1.reduce((a,s)=>a+s[1].length,0)+D.p2.reduce((a,s)=>a+s[1].length,0))*4,done=Object.values(S.r).filter(v=>v.d).length;$('#ep').textContent=Math.round(done/total*100)+'%';$('#sp').textContent=Object.values(S.s).filter(Boolean).length+'/24';$('#mp').textContent=Object.values(S.m).filter(Boolean).length+'/12'}function render(){tabs();sched();strength();met();stats()}
document.querySelectorAll('.view').forEach(e=>e.onclick=()=>{document.querySelectorAll('.view').forEach(b=>b.classList.remove('on'));e.classList.add('on');$('#strength').classList.toggle('hide',e.dataset.v!='strength');$('#metview').classList.toggle('hide',e.dataset.v!='met')});function exportD(){save();let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download=(S.player||'player')+'_training_progress.json';a.click()}function resetD(){if(confirm('Clear all progress?')){localStorage.removeItem(K);location.reload()}}$('#player').value=S.player;$('#position').value=S.position;$('#player').oninput=save;$('#position').oninput=save;render();
